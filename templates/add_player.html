{% extends "base.html" %}

{% block content %}
    <h2 style="text-align: center; margin-bottom: 30px; color: var(--secondary-color); font-size: 2em; font-weight: 700;">添加百业玩家</h2>
    
    <div class="form-container">
        <form method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label for="name">玩家名称</label>
                <input type="text" id="name" name="name" required>
            </div>
            
            <div class="form-group">
                <label for="school">流派</label>
                <input type="text" id="school" name="school" required>
            </div>
            
            <div class="form-group">
                <label for="description">详细描述</label>
                <textarea id="description" name="description" required></textarea>
            </div>
            
            <div class="form-group">
                <label for="image">上传照片</label>
                <input type="file" id="image" name="image" accept="image/*">
            </div>
            
            <div class="form-group">
                <label for="video">上传个人视频</label>
                <input type="file" id="video" name="video" accept="video/*">
                <small style="color: var(--text-light); display: block; margin-top: 5px;">支持的格式：MP4、WebM、MOV等，建议大小不超过20MB</small>
            </div>
            
            <button type="submit" class="btn btn-submit">添加玩家</button>
        </form>
    </div>
{% endblock %}
