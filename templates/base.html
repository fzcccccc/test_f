<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星愿</title>
    <style>
/* 暗黑模式样式 - 星愿系统 */

:root {
    --primary-color: #9b59b6; /* 紫色作为主色调 */
    --primary-light: #342040; /* 主色调浅色版 */
    --secondary-color: #bdc3c7; /* 浅灰色作为次要文字 */
    --secondary-light: #2c3e50; /* 次要背景色 */
    --text-color: #ecf0f1; /* 主要文字颜色 */
    --text-light: #95a5a6; /* 次要文字颜色 */
    --background-color: #1a1a1a; /* 深色背景 */
    --card-background: #2c3e50; /* 卡片背景 */
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.3); /* 更深的阴影 */
    --border-radius: 12px;
    --border-color: #34495e; /* 边框颜色 */
}

body {
    background-color: var(--background-color);
    color: var(--text-color);
    background-image: none; /* 移除背景图案 */
    font-family: 'Microsoft YaHei', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    line-height: 1.6;
    margin: 0;
    padding: 0;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* 容器样式 */
.container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 20px;
}

/* 头部样式 */
header {
    background: linear-gradient(135deg, #1a1a1a 0%, #2c3e50 100%);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    padding: 60px 0 40px;
    text-align: center;
    position: relative;
    overflow: hidden;
}

header::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm23-11c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm29 22c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zM32 63c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm57-13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-9-21c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM60 91c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM35 41c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 60c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z' fill='%23ffffff' fill-opacity='0.03' fill-rule='evenodd'/%3E%3C/svg%3E");
    z-index: 0;
}

header .container {
    position: relative;
    z-index: 1;
}

h1, header p {
    color: var(--text-color);
    text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
}

h1 {
    margin: 0;
    font-size: 2.8em;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 10px;
}

header p {
    font-size: 1.2em;
    opacity: 0.9;
    max-width: 700px;
    margin: 0 auto;
}

/* 导航栏样式 */
.nav {
    background-color: var(--card-background);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    padding: 0;
    margin-bottom: 40px;
    position: sticky;
    top: 0;
    z-index: 1000;
    border-radius: var(--border-radius);
    transform: translateY(-20px);
}

.nav .container {
    display: flex;
    justify-content: center;
    align-items: center;
}

.nav a {
    color: var(--text-color);
    text-decoration: none;
    padding: 18px 30px;
    margin: 0 5px;
    font-weight: 600;
    font-size: 16px;
    border-radius: var(--border-radius);
    transition: all 0.3s ease;
    position: relative;
}

.nav a::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 3px;
    background-color: var(--primary-color);
    transition: width 0.3s ease;
}

.nav a:hover {
    color: var(--primary-color);
    background-color: rgba(155, 89, 182, 0.1);
}

.nav a:hover::after {
    width: 50%;
}

/* 玩家网格样式 */
.player-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 30px;
    margin-top: 20px;
}

/* 玩家卡片样式 */
        .player-card {
            background-color: var(--card-background);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            padding: 0;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .player-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
        }
        
        .player-card-image {
            height: 200px;
            overflow: hidden;
            position: relative;
        }
        
        .player-card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        
        .player-card:hover .player-card-image img {
            transform: scale(1.05);
        }
        
        .player-card-content {
            padding: 25px;
        }
        
        .player-card h3 {
            margin-top: 0;
            color: var(--text-color);
            font-size: 1.4em;
            margin-bottom: 8px;
        }
        
        .player-card .school {
            color: var(--primary-color);
            font-weight: 600;
            margin-bottom: 15px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .player-card p {
            color: var(--text-light);
            margin-bottom: 20px;
            line-height: 1.7;
        }
        
        /* 按钮样式 */
        .btn {
            display: inline-block;
            background-color: var(--primary-color);
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            font-size: 14px;
            letter-spacing: 0.5px;
            text-align: center;
        }
        
        .btn:hover {
            background-color: #8e44ad;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(155, 89, 182, 0.4);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn-outline {
            background-color: transparent;
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
            box-shadow: none;
        }
        
        .btn-outline:hover {
            background-color: var(--primary-color);
            color: white;
        }
        
        .btn-secondary {
            background-color: var(--secondary-light);
            color: var(--text-color);
        }
        
        .btn-secondary:hover {
            background-color: #34495e;
        }
        
        .btn-danger {
            background-color: #e74c3c;
        }
        
        .btn-danger:hover {
            background-color: #c0392b;
        }
        
        /* 表单样式 */
        .form-container {
            background-color: var(--card-background);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            padding: 40px;
            margin-top: 20px;
        }
        
        .form-group {
            margin-bottom: 25px;
            position: relative;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-color);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit;
            transition: all 0.3s ease;
            background-color: var(--background-color);
            color: var(--text-color);
        }
        
        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(155, 89, 182, 0.2);
        }
        
        .form-group textarea {
            height: 180px;
            resize: vertical;
            min-height: 120px;
        }
        
        .form-group input[type="file"] {
            padding: 10px;
            border: 2px dashed var(--border-color);
            background-color: rgba(155, 89, 182, 0.05);
        }
        
        .form-group input[type="file"]:hover {
            border-color: var(--primary-color);
        }
        
        .btn-submit {
            background-color: var(--primary-color);
            width: 100%;
            padding: 16px;
            font-size: 16px;
        }
        
        /* 详情页样式 */
        .detail-container {
            background-color: var(--card-background);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            padding: 40px;
            margin-top: 20px;
        }
        
        .detail-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 40px;
        }
        
        .detail-image {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            overflow: hidden;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            border: 5px solid var(--secondary-light);
        }
        
        .detail-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .detail-info h3 {
            font-size: 2em;
            color: var(--text-color);
            margin-bottom: 10px;
        }
        
        .detail-info .school {
            font-size: 1.2em;
            color: var(--primary-color);
            font-weight: 600;
            margin-bottom: 20px;
        }
        
        .detail-description {
            font-size: 16px;
            line-height: 1.8;
            color: var(--text-color);
            padding: 20px 0;
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 30px;
        }
        
        .detail-actions {
            display: flex;
            justify-content: center;
        }
        
        /* 消息提示样式 */
        .flash-message {
            background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
            color: white;
            padding: 20px;
            margin-bottom: 30px;
            border-radius: var(--border-radius);
            text-align: center;
            font-weight: 600;
            box-shadow: 0 5px 15px rgba(39, 174, 96, 0.2);
            position: relative;
            overflow: hidden;
        }
        
        .flash-message::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: white;
            animation: progress 3s linear forwards;
        }
        
        @keyframes progress {
            from { width: 100%; }
            to { width: 0; }
        }
        
        /* 空状态样式 */
        .no-players {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-light);
        }
        
        .no-players h3 {
            font-size: 1.8em;
            margin-bottom: 15px;
            color: var(--text-color);
        }
        
        .no-players p {
            font-size: 1.1em;
            margin-bottom: 30px;
        }
        
        /* 页脚样式 */
        footer {
            background: linear-gradient(135deg, #1a1a1a 0%, #2c3e50 100%);
            color: white;
            text-align: center;
            padding: 50px 0;
            margin-top: 80px;
        }
        
        footer p {
            opacity: 0.8;
            margin: 0;
        }
        
        /* 链接样式 */
        a {
            color: var(--primary-color);
        }
        
        a:hover {
            color: #8e44ad;
        }
        
        /* 视频播放器样式 */
        video {
            background-color: #000;
            border-radius: var(--border-radius);
        }
        
        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 10px;
        }
        
        ::-webkit-scrollbar-track {
            background: var(--background-color);
        }
        
        ::-webkit-scrollbar-thumb {
            background: var(--secondary-light);
            border-radius: 5px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-light);
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            h1 {
                font-size: 2.2em;
            }
            
            .player-grid {
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
                gap: 20px;
            }
            
            .nav a {
                padding: 15px 20px;
                font-size: 14px;
            }
            
            .form-container,
            .detail-container {
                padding: 30px 20px;
            }
            
            .detail-image {
                width: 150px;
                height: 150px;
            }
            
            .detail-info h3 {
                font-size: 1.8em;
            }
        }
        
        @media (max-width: 480px) {
            header {
                padding: 40px 0 30px;
            }
            
            h1 {
                font-size: 1.8em;
            }
            
            header p {
                font-size: 1em;
            }
            
            .nav .container {
                flex-direction: column;
                padding: 10px;
            }
            
            .nav a {
                display: block;
                width: 100%;
                text-align: center;
                margin: 5px 0;
            }
            
            .player-grid {
                grid-template-columns: 1fr;
            }
            
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>星愿</h1>
    </header>
    
    <div class="container">
        <div class="nav">
            <a href="{{ url_for('index') }}">玩家列表</a>
            <a href="{{ url_for('add_player') }}">添加玩家</a>
        </div>
        
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="flash-message">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        
        {% block content %}
        {% endblock %}
    </div>
    
    <footer>
        <p>&copy; 星愿</p>
    </footer>
</body>
</html>
